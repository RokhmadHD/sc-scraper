services:
  postgres:
    image: postgres:16-alpine
    container_name: sc-scraper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sc_scraper}
      POSTGRES_USER: ${POSTGRES_USER:-sc_scraper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sc_scraper_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sc_scraper} -d ${POSTGRES_DB:-sc_scraper}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
