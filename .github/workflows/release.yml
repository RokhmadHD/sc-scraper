name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build release assets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/contract-scraper${{ matrix.ext }}" ./cmd/contract-scraper
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "contract-scraper_${{ matrix.goos }}_${{ matrix.goarch }}.zip" "contract-scraper${{ matrix.ext }}"
          else
            tar -czf "contract-scraper_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" "contract-scraper${{ matrix.ext }}"
          fi

      - name: Upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
